name: Build Dark Bot PSP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile
        run: make clean && make
      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: DarkBot-EBOOT
          path: EBOOT.PBP
          if-no-files-found: error
