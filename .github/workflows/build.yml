
name: Dark Bot PSP - Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build EBOOT
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar arquivos
        run: |
          echo "Diretorio atual:"
          pwd
          echo "Arquivos da raiz:"
          ls -la
          echo "Arquivos do projeto:"
          find . -maxdepth 4 -type f

      - name: Conferir Makefile
        run: |
          if [ ! -f ./Makefile ]; then
            echo "ERRO: Makefile nao encontrado na raiz."
            exit 1
          fi
          echo "Makefile encontrado."

      - name: Conferir codigo
        run: |
          test -f src/main.c
          test -f src/png_loader.c
          test -f src/png_loader.h

      - name: Compilar
        run: |
          make clean
          make

      - name: Conferir EBOOT
        run: |
          test -s EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Disponibilizar jogo
        uses: actions/upload-artifact@v4
        with:
          name: DarkBot-PSP
          path: EBOOT.PBP
          if-no-files-found: error
          retention-days: 14
